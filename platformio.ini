[platformio]
src_dir = .
include_dir = .
deafult_envs = release

[env:release]
platform = ststm32
upload_protocol = stlink
debug_tool = stlink
platform_packages = 
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
extra_scripts = pre:scripts/build_script.py

; here you'll fill in the exact board and ldscript for your project
board = 
board_build.ldscript = 

build_flags = 
    -DUSE_HAL_DRIVER
build_src_filter = 
    +<Core/Src/>
; here you will add other folders. To do that correctly go check other
; repo where it's already done, or check the generated Makefile

; here you will add libraries you need (e.g. libeagletrt, libring-buffer, ...)
lib_deps =

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.*
    clangtidy: --system-headers=false
check_src_filters =
    -<**>
    +<Core/Src/>
    +<Core/Inc/>
    -<Core/Src/stm32*_hal_msp.c>
    -<Core/Src/stm32*_it.c>
    -<Core/Src/syscalls.c>
    -<Core/Src/sysmem.c>

[env:tests]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -DEAGLETRT_STATIC=
    -DEAGLETRT_STATIC_INLINE=
; fill in other required includes
build_src_filter =
; here you will add other folders where your modules are
